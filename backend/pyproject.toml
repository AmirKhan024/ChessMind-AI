[project]
name = "chessmind"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "psycopg[binary]",
    "redis",
    "rq",
    "chess",
    "httpx",
    "sqlalchemy",
    "alembic",
    "python-multipart",
    "lightgbm",
    "pandas",
]

[dependency-groups]
dev = ["pytest", "ruff"]
ml = ["zstandard", "pyarrow", "scikit-learn", "matplotlib"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
