<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% block head %}{% endblock %}
  <title>{% block title %}ChessMind AI{% endblock %}</title>
  <style>
    :root { --fg: #1d2330; --muted: #5f6878; --bg: #f6f5f1; --card: #fff; --line: #dedbd2;
            --accent: #2e6e4f; --bad: #b23b36; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e8e6e1; --muted: #a2a8b3; --bg: #16191f; --card: #1f232b; --line: #343a45;
              --accent: #6cc495; --bad: #e57b75; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    header a { color: var(--fg); font-weight: 700; text-decoration: none; }
    main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.6rem; margin: 0 0 12px; }
    h2 { font-size: 1.2rem; margin: 28px 0 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 18px; margin: 14px 0; }
    .muted { color: var(--muted); font-size: .92rem; }
    .error { color: var(--bad); font-weight: 600; }
    label { display: block; font-weight: 600; margin: 8px 0 4px; }
    input[type=text], input[type=file] { width: 100%; max-width: 360px; padding: 8px;
            border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
    button { margin-top: 12px; padding: 9px 16px; border: 0; border-radius: 6px;
             background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    progress { width: 100%; height: 14px; }
    .stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 8px 0; }
    .examples { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; }
    .example { max-width: 300px; }
    .example svg { width: 100%; height: auto; display: block; }
    h3 { font-size: 1rem; margin: 18px 0 6px; }
    .puzzle { width: 160px; color: inherit; text-decoration: none; }
    .puzzle svg { width: 100%; height: auto; display: block; }
    .played { color: var(--bad); font-weight: 600; }
    .best { color: var(--accent); font-weight: 600; }
    .tag { font-size: .8rem; font-weight: 500; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: .95rem; }
    th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    td.worse { color: var(--bad); font-weight: 600; }
    td.better { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <header><a href="/">ChessMind AI</a></header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
